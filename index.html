<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de códigos</title>

  <!-- Evita que el navegador guarde en caché una versión vieja de este HTML -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

  <main class="tarjeta">
    <h1 class="titulo">Conversor de códigos</h1>

    <label for="input-codigo" class="etiqueta">Código o nombre del producto</label>
    <input
      type="text"
      id="input-codigo"
      class="input-codigo"
      inputmode="text"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      placeholder="Escanea un código o escribe el nombre…"
      autofocus
    >

    <section id="resultado" class="resultado resultado--vacio" aria-live="polite">
      <span id="resultado-nombre" class="resultado-nombre"></span>
      <div id="skus-lista" class="skus-lista"></div>
      <p id="mensaje-error" class="mensaje-error" hidden>CÓDIGO NO REGISTRADO</p>
      <div id="resultado-acciones" class="resultado-acciones" hidden>
        <button id="btn-editar" type="button" class="accion-btn">Editar</button>
        <button id="btn-eliminar" type="button" class="accion-btn accion-btn--peligro">Eliminar</button>
      </div>
    </section>

    <section id="lista-resultados" class="lista-resultados" hidden aria-live="polite">
      <p class="lista-titulo">Varios productos coinciden, elige uno:</p>
      <div id="lista-items" class="lista-items"></div>
    </section>

    <p id="contador" class="contador"></p>
  </main>

  <a href="consulta.html" class="btn-flotante btn-flotante--secundario" title="Consultar DNI / RUC" aria-label="Consultar DNI o RUC">🪪</a>
  <button id="btn-agregar" class="btn-flotante" type="button" title="Agregar producto" aria-label="Agregar producto">+</button>

  <div id="modal-fondo" class="modal-fondo" hidden>
    <form id="form-agregar" class="modal-tarjeta">
      <h2 class="modal-titulo" id="modal-titulo">Agregar producto</h2>

      <label for="campo-nombre" class="modal-etiqueta">Nombre del producto</label>
      <input type="text" id="campo-nombre" class="modal-input" autocomplete="off" required>

      <label for="campo-sku" class="modal-etiqueta">SKU</label>
      <input type="text" id="campo-sku" class="modal-input" autocomplete="off" placeholder="Ej: 0047 (o 0047,0048 si es combo)" required>

      <label for="campo-codigo" class="modal-etiqueta">Código de barras (o palabra clave)</label>
      <input type="text" id="campo-codigo" class="modal-input" autocomplete="off" placeholder="Ej: 7758451236 o cafe" required>

      <p id="modal-mensaje" class="modal-mensaje" hidden></p>

      <div class="modal-botones">
        <button type="button" id="btn-cancelar" class="modal-btn modal-btn--secundario">Cancelar</button>
        <button type="submit" id="btn-guardar" class="modal-btn modal-btn--principal">Guardar</button>
      </div>
    </form>
  </div>

  <!-- config.js debe cargarse primero: trae URL_APPS_SCRIPT y CLAVE_SECRETA -->
  <!-- codigos.js debe cargarse ANTES que script.js -->
  <!-- El sufijo ?v= sirve para forzar actualización cuando cambias el archivo (ver instrucciones) -->
  <script src="config.js?v=1"></script>
  <script src="codigos.js?v=8"></script>
  <script src="script.js?v=15"></script>
</body>
</html>
